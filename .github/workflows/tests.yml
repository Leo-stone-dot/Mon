name: Xcode 27 gates

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-build-and-test:
    name: Xcode 27.2 / SDK 27.2 / arm64
    # GitHub's public preview Xcode 27 Arm64 image currently provides macOS
    # 27.0.1 and Xcode 27.2. Pin DEVELOPER_DIR because 27.1 is the image default.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap pinned tools
        run: Scripts/bootstrap-tools.sh
      - name: Run CI build gates
        run: Scripts/ci-build.sh
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-27-build-environment
          path: build/environment
