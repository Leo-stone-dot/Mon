name: Xcode 27 gates

on:
  push:
    branches: [ development ]
  pull_request:
  workflow_dispatch:

jobs:
  sdk-build-and-test:
    name: Xcode 27.2 / SDK 27.2 / arm64
    # These labels intentionally describe the real runner contract. A hosted
    # label is not a substitute until GitHub publishes this exact environment.
    runs-on: [self-hosted, macOS, ARM64, xcode-27.2, macos-26, ci]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bootstrap pinned tools
        run: Scripts/bootstrap-tools.sh
      - name: Run CI build gates
        run: Scripts/ci-build.sh
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-27-build-environment
          path: build/environment

  macos-27-runtime-contracts:
    name: macOS 27.2 physical runner preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64, xcode-27.2, macos-27.2, physical]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record and verify physical runner
        run: Scripts/verify-physical-runner.sh
      - name: Capture physical validation evidence
        if: always()
        run: Scripts/capture-physical-validation-evidence.sh build/physical-validation
      - name: Upload physical validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-27-physical-validation
          path: build/physical-validation

  # AX/TCC/CGS scenarios will be added here as WP2 lands. Physical execution is
  # opt-in because it changes permission and Space state on a dedicated Mac.

